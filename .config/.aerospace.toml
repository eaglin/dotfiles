# AeroSpace configuration managed in Personal/dotfiles.
# The active config is ~/.aerospace.toml (symlinked to this file).
config-version = 2

# Start AeroSpace at login.
start-at-login = true
after-login-command = []
after-startup-command = [
  "exec-and-forget borders style='round' width=5 active_color='0xff00d9ff' inactive_color='0xff26233a'",
  "layout --workspace 5 --root accordion"
]

# Notify SketchyBar, if it is installed, about workspace changes.
exec-on-workspace-change = ['/bin/bash', '-c',
  'command -v sketchybar >/dev/null 2>&1 && sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Match yabai's bsp defaults.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 10
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ["exec-and-forget command -v sketchybar >/dev/null 2>&1 && sketchybar --trigger aerospace_workspace_change"]
automatically-unhide-macos-hidden-apps = true

# Gaps match .yabairc.
[gaps]
  inner.horizontal = 10
  inner.vertical = 10
  outer.left = 10
  outer.bottom = 10
  outer.top = 10
  outer.right = 10

# Match yabai app-to-space rules and per-space layouts.
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.zenbrowser.zen || test %{app-bundle-id} = com.google.Chrome'
  run = 'move-node-to-workspace 1'

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
  run = ['move-node-to-workspace 2', 'layout floating']

[[on-window-detected]]
  if = 'test %{app-bundle-id} ~= com.jetbrains.intellij || test %{app-bundle-id} = com.apple.dt.Xcode'
  run = ['move-node-to-workspace 3', 'layout floating']

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.obsproject.obs-studio || test %{app-bundle-id} = com.lemon.lvoverseas || test %{app-bundle-id} = com.blackmagic-design.DaVinciResolve || test %{app-name} ~= ClipGrab || test %{app-name} ~= Blackmagic'
  run = ['move-node-to-workspace 4', 'layout floating']

[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.Notes || test %{app-bundle-id} = com.microsoft.Word || test %{app-bundle-id} = com.microsoft.Excel || test %{app-bundle-id} = com.microsoft.Outlook || test %{app-bundle-id} = com.microsoft.teams2 || test %{app-name} ~= WhatsApp || test %{app-bundle-id} = com.docker.docker'
  run = ['move-node-to-workspace 5', 'layout accordion']

# Utility windows stay floating and under macOS control, like manage=off in yabai.
[[on-window-detected]]
  if = 'test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = com.apple.systempreferences || test %{app-bundle-id} = org.pqrs.Karabiner-Elements.Settings || test %{app-bundle-id} = org.pqrs.Karabiner-Elements'
  run = 'layout floating'

# Keybindings preserve the yabai/skhd shortcuts.
[key-mapping]
  preset = 'qwerty'

[mode.main.binding]
  # Focus windows.
  alt-h = 'focus left'
  alt-j = 'focus down'
  alt-k = 'focus up'
  alt-l = 'focus right'

  # Reorder windows (the closest AeroSpace equivalent to yabai --swap).
  alt-shift-h = 'swap left'
  alt-shift-j = 'swap down'
  alt-shift-k = 'swap up'
  alt-shift-l = 'swap right'

  # Window controls.
  alt-q = 'close'
  alt-f = 'fullscreen --no-outer-gaps'
  alt-shift-f = 'layout floating tiling'

  # Resize: comma/period and ]/O preserve skhd keycodes 0x2B/0x2F and 0x1E/0x1F.
  alt-shift-comma = 'resize width -50'
  alt-shift-period = 'resize width +50'
  alt-shift-rightSquareBracket = 'resize height -50'
  alt-shift-o = 'resize height +50'

  # Space layouts: bsp -> tiles, stack -> accordion, float -> floating.
  alt-ctrl-space = 'layout tiles accordion floating'
  alt-ctrl-t = 'layout tiles'
  alt-ctrl-s = 'layout accordion'
  alt-ctrl-f = 'layout floating'
  alt-ctrl- = 'balance-sizes'

  # Focus spaces.
  alt-1 = 'workspace 1'
  alt-2 = 'workspace 2'
  alt-3 = 'workspace 3'
  alt-4 = 'workspace 4'
  alt-5 = 'workspace 5'
  alt-tab = 'workspace-back-and-forth'

  # Move the focused window and follow it.
  alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
  alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
  alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
  alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
  alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']

  # App launchers; destinations match the yabai rules.
  alt-shift-cmd-ctrl-o = 'exec-and-forget open -a "/Applications/OBS.app"'
  alt-shift-cmd-ctrl-n = 'exec-and-forget open -a "/System/Applications/Notes.app"'
  alt-shift-cmd-ctrl-w = 'exec-and-forget open -a "/Applications/WhatsApp.app"'
  alt-shift-cmd-ctrl-r = 'exec-and-forget open -a "/Applications/DaVinci Resolve/DaVinci Resolve.app"'
  alt-shift-cmd-ctrl-g = 'exec-and-forget open -a "/Applications/Ghostty.app"'
  alt-shift-cmd-ctrl-i = 'exec-and-forget open -a "IntelliJ IDEA"'
  alt-shift-cmd-ctrl-c = 'exec-and-forget open -a "/Applications/CapCut.app"'
  alt-shift-cmd-ctrl-s = 'exec-and-forget open -a "/Applications/Google Chrome.app"'
  alt-shift-cmd-ctrl-f = 'exec-and-forget "$HOME/.local/bin/finder-here"'

  # Existing extra launchers from the Aerospace config.
  alt-shift-cmd-ctrl-v = 'exec-and-forget open -a "/Applications/Visual Studio Code.app"'
  alt-shift-cmd-ctrl-t = 'exec-and-forget open -a "/Applications/Telegram.app"'
  alt-shift-cmd-ctrl-b = 'exec-and-forget open -a "/Applications/ClipGrab.app"'

  # Preserve the existing service/resize modes.
  alt-shift-semicolon = 'mode service'
  alt-shift-r = 'mode resize'

[mode.service.binding]
  esc = ['reload-config', 'mode main']
  r = ['flatten-workspace-tree', 'mode main']
  f = ['layout floating tiling', 'mode main']
  backspace = ['close-all-windows-but-current', 'mode main']
  alt-shift-h = ['join-with left', 'mode main']
  alt-shift-j = ['join-with down', 'mode main']
  alt-shift-k = ['join-with up', 'mode main']
  alt-shift-l = ['join-with right', 'mode main']
  down = 'volume down'
  up = 'volume up'
  shift-down = ['volume set 0', 'mode main']

[mode.resize.binding]
  esc = 'mode main'
  h = 'resize width -50'
  l = 'resize width +50'
  k = 'resize height +50'
  j = 'resize height -50'
