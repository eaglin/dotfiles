# #
# #
 # set -g @rose_pine_variant 'main'
#
# # Keep the theme in control of the status line and let other plugins only
# # interpolate inside it.
set -g @rose_pine_host 'off'
set -g @rose_pine_hostname_short 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'
set -g @rose_pine_date_time '%H:%M'
set -g @rose_pine_default_window_behavior 'off'
set -g @rose_pine_only_windows 'off'
set -g @rose_pine_disable_active_window_menu 'off'
#
# # Example values for these can be:
set -g @rose_pine_left_separator '' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator '' # Accepts both normal chars & nerdfont icons
set -g @rose_pine_field_separator ' | ' # Default is two-space-padded, but can be set to anything
set -gu @rose_pine_window_separator ' '
# set -g @rose_pine_window_separator ' - ' # Replaces the default `:` between the window number and name
#
# # These are not padded
set -g @rose_pine_session_icon '' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '' # Changes the default icon to the left of the active window name
set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon '' # Changes the default icon to the right of the hostname
set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname
set -g @rose_pine_date_time_icon '󰃰' # Changes the default icon to the right of the date module
set -g @rose_pine_window_status_separator ' | '
#
# # Very beta and specific opt-in settings, tested on v3.2a, look at issue #10
set -g @rose_pine_prioritize_windows 'on' # Disables the right side functionality in a certain window count / terminal width
set -g @rose_pine_width_to_hide '80' # Specify a terminal width to toggle off most of the right side functionality
set -g @rose_pine_window_count '5' # Specify a number of windows, if there are more than the number, do the same as width_to_hide
# Avoid first-load misdetection in rose-pine when tmux has not settled window width yet.
set -g @rose_pine_prioritize_windows 'off'
# Add to the beginning / end of the left and right sections your own.
 set -g @rose_pine_status_left_append_section ''
# set -g @rose_pine_status_right_prepend_section 'with normal text'
# set -g @rose_pine_status_right_append_section 'too'

# Fix index
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g status-style 'fg=#e0def4,bg=#232136'
set -g status-justify left
set -g status-left '#[fg=#{?client_prefix,#eb6f92,#31748f},bg=#232136]   #[fg=#e0def4,bg=#232136]#S - '
set -g status-right-length 120
set -g status-right '#[fg=#eb6f92,bg=#232136] #[fg=#e0def4,bg=#232136]#{pane_current_path} #[fg=#6e6a86,bg=#232136] >  #[fg=#9ccfd8,bg=#232136] #[fg=#e0def4,bg=#232136]%H:%M '
setw -g window-status-style 'fg=#ffffff,bg=#232136'
setw -g window-status-current-style 'fg=#191724,bg=#31748f,bold'
setw -g window-status-format ' #I #W '
setw -g window-status-current-format ' #I #W '
setw -g window-status-separator '#[fg=#6e6a86,bg=#232136] | '
set -gu status-format[1]
set -g pane-border-style 'fg=#191724'
set -g pane-active-border-style 'fg=#191724'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on
# --- terminal & key handling ---
# set -g xterm-keys on
# set -g extended-keys on

setw -g mode-keys vi
# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

run '~/.config/tmux/plugins/tpm/tpm'
# run ~/.config/tmux/plugins/tmux/rose-pine.tmux
